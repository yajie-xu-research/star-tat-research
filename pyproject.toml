[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-tat-research"
version = "1.4.0"
description = "Stage-normalized turnaround-time interval forecasting for multi-site clinical laboratory workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - internal research use"}

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
star-tat = "star_tat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
